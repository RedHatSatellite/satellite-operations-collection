---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Configure Puppet repositories
      ansible.builtin.include_role:
        name: theforeman.operations.puppet_repositories
    - name: Configure Foreman repositories
      ansible.builtin.include_role:
        name: theforeman.operations.foreman_repositories
      vars:
        foreman_repositories_version: "3.16"
        foreman_repositories_katello_version: "4.18"
    - name: Setup fake installer
      ansible.builtin.include_role:
        name: fake_installer_rpm
    - name: Ensure langpacks on EL8
      ansible.builtin.dnf:
        name: glibc-langpack-en
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
    - name: Install installer
      ansible.builtin.package:
        name: foreman-installer
        state: present
    - name: Disable force_fact_upload
      ansible.builtin.lineinfile:
        path: /etc/foreman-installer/custom-hiera.yaml
        line: 'foreman::register::force_fact_upload: false'
    - name: Disable always_run_migrations
      ansible.builtin.lineinfile:
        path: /etc/foreman-installer/custom-hiera.yaml
        line: 'pulpcore::database::always_run_migrations: false'
