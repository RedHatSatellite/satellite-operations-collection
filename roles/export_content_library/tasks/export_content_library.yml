---
# Check if export file exists
- name: Export Library | Check if another export is running via lock file
  ansible.builtin.stat:
    path: "{{ satellite_export_lock_file }}"
  register: satellite_export_lock_status

# Run shell command to check if Satellite exports are actively running
- name: Export Library | Verify there are no hammer content_export jobs running
  ansible.builtin.shell: hammer task list --fields id,action,state --search="state = running" | grep -i export | wc -l
  register: hammer_job_results
  become: true # must be root to execute this task
  changed_when: false

# Validate no other export jobs are running
- name: Export Library | Fail if another export is running
  ansible.builtin.assert:
    that:
      - not satellite_export_lock_status['stat']['exists']
      - hammer_job_results['stdout'] != "0" # output for export
    fail_msg: >
      Another export process is running.
      Manually verify no exports are running (currently {{ hammer_job_results['stdout'] }} jobs are running).
      Validate {{ satellite_export_lock_file }} is removed before trying again.
    success_msg: "There are currently no other exports running at this time."
  when: satellite_export_lock_status['stat']['exists']

# Create new lock file
- name: Export Library | Create lock file
  ansible.builtin.file:
    path: "{{ satellite_export_lock_file }}"
    state: touch
    mode: '0644'
  when: not satellite_export_lock_status['stat']['exists']

# Check disk space availability
- name: Export Library | Check available disk space
  ansible.builtin.assert:
    that:
      - not (ansible_mounts | selectattr("mount", "equalto", satellite_directories) | list) | map(attribute='size_available') | first < satellite_required_space_gb | human_to_bytes(default_unit="G")
    fail_msg: "Please make sure there is enough available space before executing an export."
    quiet: true

# Remove old exports - STILL WIP
- name: Export Library | Cleanup old exports
  when: 
    - satellite_cleanup_old_exports
  become: true
  block:
    - name: Cleanup old exports | Find old exports
      ansible.builtin.find:
        paths: "/var/lib/pulp/exports"
        file_type: file
        patterns: "export-*"
        age: "{{ satellite_cleanup_old_export_age }}"
      register: old_exports

    - name: Cleanup old exports | Remove old exports
      ansible.builtin.file:
        path: "{{ file['path'] }}"
        state: absent
      loop: "{{ old_exports['files'] }}"
      loop_control:
        loop_var: file
        label: "{{ file }}"

  rescue:
    - name: Cleanup old exports | Log cleanup failure
      ansible.builtin.debug:
        msg: "Failed to cleanup old exports"

    # Add a fail task here?

# Export Library when satellite_export_library is set to true
- name: Export Content - Library | Export entire Library content
  when:
    - satellite_export_library
  block:
    # Export Library content
    - name: Export entire Library content | Export to timestamped directory
      redhat.satellite.content_export_library:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization }}"
        destination_server: "{{ satellite_export_destination_server_fqdn | default(omit, true) }}"
        format: "{{ satellite_export_library_format | default('syncable', true) }}"
        fail_on_missing_content: "{{ satellite_export_content_view_fail_on_missing_content | default(true) }}"
        incremental: "{{ satellite_export_library_incremental | default(false) }}"
      register: export_library_results
      until: export_library_results is success
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"

  rescue:
    # Export failed message
    - name: Export entire Library content | Handle export failure
      debug:
        msg: "Satellite export failed"

# Remove Lock File when completed
- name: Export Content - Library | Remove lock file
  ansible.builtin.file:
    path: "{{ satellite_export_lock_file }}"
    state: absent
...