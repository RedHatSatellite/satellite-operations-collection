satellite_rhel_product_name: "Red Hat Enterprise Linux for x86_64"
satellite_capsule_product_name: "Red Hat Satellite Capsule"
satellite_rhel_s390_product_name: "Red Hat Enterprise Linux for IBM z Systems"
satellite_code_ready_s390_product_name: "Red Hat CodeReady Linux Builder for IBM z Systems"
satellite_epel_product_name: "EPEL"

satellite_lifecycle_envs:
  - name: satellite_lifecycle_capsule
    env_name: "satinfra"
    prior: "Library"

  - name: satellite_lifecycle_daily
    env_name: "daily"
    prior: "Library"
  
  - name: satellite_lifecycle_certify
    env_name: "certify"
    prior: "Library"

  - name: satellite_lifecycle_monthly
    env_name: "monthly"
    prior: "certify"

satellite_content_views:
  - name: capsule6
    repositories:
      - name: "Red Hat Enterprise Linux 9 for x86_64 - AppStream RPMs 9"
        product: "{{ satellite_rhel_product_name }}"
      - name: "Red Hat Enterprise Linux 9 for x86_64 - BaseOS RPMs 9"
        product: "{{ satellite_rhel_product_name }}"
      - name: "Red Hat Satellite Maintenance {{ satellite_deployment_version }} for RHEL 9 x86_64 RPMs"
        product: "{{ satellite_rhel_product_name }}"
