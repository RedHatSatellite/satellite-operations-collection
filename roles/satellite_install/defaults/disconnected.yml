# Credentials
satellite_admin_username: admin
satellite_admin_password:
satellite_username: "{{ satellite_admin_username }}"
satellite_password: "{{ satellite_admin_password }}"

# System requirements
satellite_min_cpu_count: 4
# Size must be integer, MB
satellite_min_memory_size: 20240
# Size must be integer, GB
satellite_data_disk_min_size: 500
# Size must be integer, GB
satellite_min_pulp_size: 300
# Size must be integer, GB
satellite_min_pgsql_size: 20

# Administration
satellite_server_url: "https://{{ ansible_fqdn }}"
satellite_organization:
satellite_initial_location: # AAP Survey
satellite_location: "{{ satellite_initial_location }}"
satellite_email:
satellite_giturl: git.example.com
satellite_disconnected_manifest_path:
satellite_language: "en_US.utf-8"

# Storage
satellite_pulp_size: 1500g
satellite_pgsql_size: 150g
satellite_req_dirs:
  - mount_point: /var/lib/pulp
    lv_name: lv_rhspulp
    lv_size: "{{ satellite_pulp_size }}"
  - mount_point: /var/lib/pgsql
    lv_name: lv_pgsql
    lv_size: "{{ satellite_pgsql_size }}"
# Manually define device name if desired (required if multiple devices are suitable as the automation can only select 1)
# satellite_data_device_name: sdc
satellite_data_disk: "{{ satellite_data_device }}/{{ satellite_data_device_name }}"
satellite_vg_name: vg_rhsat

# Satellite
satellite_rhn_connected: false
satellite_connected_fqdn: # AAP
satellite_ak: "satellite6-satinfra"
satellite_capsule_ak: "capsule6-satinfra"
satellite_selinux_state: "enforcing"
satellite_installer_scenario: "satellite"
satellite_sync_time: "19:30:00"
satellite_sync_date: "{{ ansible_date_time['date'] }} {{ satellite_sync_time }} {{ ansible_date_time['tz'] }}"
satellite_syncplan_interval: "daily"
satellite_syncplan_name: "{{ satellite_syncplan_interval | capitalize }} {{ satellite_organization }} Products"
satellite_subscription_to_search: "Red Hat Satellite Infrastructure Subscription"
satellite_repo_sync_wait_time: 21600 # Seconds

satellite_installer_options:
  - '--foreman-initial-admin-username {{ satellite_admin_username }}'
  - '--foreman-initial-admin-password {{ satellite_admin_password }}'
  - '--foreman-initial-organization {{ satellite_organization }}'
  - '--foreman-initial-location {{ satellite_initial_location }}'

# Basic Settings
satellite_settings:
  - name: "default_download_policy"
    value: "immediate"
  - name: "default_redhat_download_policy"
    value: "immediate"
  - name: "default_proxy_download_policy"
    value: "immediate"
  - name: "errata_status_installable"
    value: "true"
  - name: "unregister_delete_host"
    value: "true"
  - name: "template_sync_associate"
    value: "never"
  - name: "template_sync_branch"
    value: "master"
  - name: "template_sync_repo"
    value: "{{ satellite_giturl }}"
  - name: "template_sync_force"
    value: "true"
  - name: "template_sync_lock"
    value: "true"
  - name: "administrator"
    value: "{{ satellite_email }}"
  - name: "db_pending_seed"
    value: "false"
  - name: "entries_per_page"
    value: "100"
  - name: "unregister_delete_host"
    value: "true"
  - name: "remote_execution_workers_pool_size"
    value: "100"
  - name: "ignored_interface_identifiers"
    value: [ "lo","en*v*", "usb*", "vnet*", "macvtap*", "_vdsmdummy_", "veth*", "docker*", "tap*", "qbr*", "qvb*", "qvo*", "qr-*", "qg-*", "vlinuxbr*", "vovsbr*" ,"bond*" ]
  - name: "host_tasks_workers_pool_size"
    value: "100"
  - name: "login_text"
    value: "WARNING: You are entering a Private Network. Only approved Example workers using valid log-in credentials are authorized byond this point, subject to Example Policies and contract terms. By accessing this network, you affirm that your system is equipped with active and current protective measures: Anti-Virus/Malware; OS Security updates and active Firewall. It is against Example policy to store Example Confidential or Regulated data on non-Example systems. Example reserves the right to actively log, monitor and disconnect any session not meeting these reequirements or those that pose unwarranted risk to Example's network or systems. If you are not an authorized user, cancel or exit immediately."
  - name: "unattended_url"
    value: "https://{{ ansible_fqdn }}"

satellite_packages:
  - satellite
  - chrony
  - sos
  - fapolicyd
  - vim
  - bash-completion
  - bind-utils

satellite_size:
  - name: default
    min_hosts: 0
    max_hosts: 5000
    min_ram: 20
    min_cpu: 4
  - name: medium
    min_hosts: 5000
    max_hosts: 10000
    min_ram: 32
    min_cpu: 8
  - name: large
    min_hosts: 10000
    max_hosts: 20000
    min_ram: 64
    min_cpu: 16
  - name: extra-large
    min_hosts: 20000
    max_hosts: 60000
    min_ram: 128
    min_cpu: 32
  - name: extra-extra-large
    min_hosts: 60000
    max_hosts: 100000
    min_ram: 256
    min_cpu: 48

satellite_redhat_repos:
  - name: "Red Hat Satellite Capsule {{ satellite_deployment_version }} for RHEL {{ ansible_distribution_major_version }} x86_64 (RPMs)"
    label: "satellite-capsule-{{ satellite_deployment_version }}-for-rhel-{{ ansible_distribution_major_version }}-x86_64-rpms"
    all: "true"
  - name: "Red Hat Satellite Maintenance {{ satellite_deployment_version }} for RHEL {{ ansible_distribution_major_version }} x86_64 (RPMs)"
    label: "satellite-maintenance-{{ satellite_deployment_version }}-for-rhel-{{ ansible_distribution_major_version }}-x86_64-rpms"
    all: "true"
