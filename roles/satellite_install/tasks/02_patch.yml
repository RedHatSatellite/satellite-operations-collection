---
- name: Clean dnf-clean-metadata
  ansible.builtin.file:
    path: /var/cache/dnf
    state: absent

- name: Remove unneeded packages
  ansible.builtin.dnf:
    name: iwl7265-firmware
    state: absent

- name: Check servers with latest packages updates
  ansible.builtin.dnf:
    list: updates
  register: package_updates
  when: ansible_distribution == "RedHat"

- name: Print the number of package updates
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} has {{ package_updates['results'] | count }} updates"
  when: package_updates['results'] | count > 0

# TODO Move non-patch tasks out of block (scenario: server is fully patched but SELinux is disabled, reboot needed, etc.)
- name: Update host
  when:
    - package_updates['results'] | count > 0
  block:
    - name: Ensure package updates variable is defined
      ansible.builtin.assert:
        that:
          - package_updates is defined

    - name: Update server with latest packages # noqa: package-latest
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when:
        - ansible_distribution == "RedHat"
        - package_updates['results'] | count > 0

    - name: Enable SELinux
      ansible.posix.selinux:
        policy: targeted
        state: "{{ satellite_selinux_state }}"

    - name: Create autorelabel file # noqa: risky-file-permissions
      ansible.builtin.file:
        path: /.autorelabel
        state: touch

    - name: Check if server needs to restart
      ansible.builtin.command: needs-restarting -r
      register: restart_required
      ignore_errors: true
      failed_when: false
      changed_when: restart_required['rc'] != 0

    - name: Reboot on new kernel
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after Linux kernel update"
        reboot_timeout: 3600
        test_command: date

- name: Refreshing Ansible facts
  ansible.builtin.setup:
...
